version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16 
    container_name: synapse_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: synapsedb
    ports:
      - "5433:5432"
    volumes:
      - synapse_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: synapse_redis
    ports:
      - "6379:6379"

volumes:
  synapse_pgdata: