version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16 
    container_name: edusai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: edusaidb
    ports:
      - "5433:5432"
    volumes:
      - edusai_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: edusai_redis
    ports:
      - "6379:6379"

volumes:
  edusai_pgdata: